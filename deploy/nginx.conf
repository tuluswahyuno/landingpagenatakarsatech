# Nginx untuk natakarsa.com
# Salin ke /etc/nginx/sites-available/natakarsa, ganti DOMAIN dan APP_DIR, lalu:
#   sudo ln -s /etc/nginx/sites-available/natakarsa /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d natakarsa.com -d www.natakarsa.com     (SSL gratis)

server {
    listen 80;
    server_name natakarsa.com www.natakarsa.com;   # DOMAIN

    # Batas ukuran upload dari panel admin (video maks. 30 MB)
    client_max_body_size 35m;

    # Aset hasil build: nama file berisi hash, aman di-cache 1 tahun
    location /_astro/ {
        alias /var/www/natakarsa/web/dist/client/_astro/;   # APP_DIR
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # File upload dari panel admin, disajikan langsung oleh Nginx
    location /uploads/ {
        alias /var/www/natakarsa/web/uploads/;   # APP_DIR
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        # Hanya jenis file yang diizinkan
        location ~* \.(jpe?g|png|webp|gif|avif|mp4|webm|pdf)$ { }
        location ~ { return 404; }
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
}
